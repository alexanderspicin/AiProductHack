<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Примеры и сравнение аватара</title>
<style>
:root{font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#23322f;background:#f4f5f0;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}main{max-width:1120px;margin:auto;padding:26px 20px}h1{font-size:30px;line-height:1.2;text-wrap:balance}p{color:#5c6963;text-wrap:pretty}a{color:#1d5c46}video{display:block;width:100%;max-height:68vh;background:#e1e6df;outline:1px solid #0000001a;border-radius:12px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{min-height:44px;padding:10px 16px;border-radius:8px;font:inherit}button{border:0;background:#1d5c46;color:white;cursor:pointer;transition:scale 120ms}button:active{scale:.96}select{border:1px solid #adc0b4;background:white;color:#23322f}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #578c74;outline-offset:3px}#status{min-height:26px;font-variant-numeric:tabular-nums}details{font-size:13px;margin-top:20px}@media(prefers-reduced-motion:reduce){button{transition:none}}</style>
<main><a href="/">Вернуться к своему тексту</a><h1>Послушать и сравнить</h1><label for="clip">Пример</label><div class="controls"><select id="clip"><option value="comparison">GPU и два варианта предрасчёта</option><option value="new_training_cpu">Разговор с клиентом</option><option value="new_closures_cpu">Смыкания губ: «Борис, мы можем…»</option><option value="new_rounding_cpu">Округлённые звуки: «У Ольги…»</option></select><button id="play">Воспроизвести</button><button id="pause">Пауза</button></div>
<video id="video" controls playsinline preload="metadata" poster="/comparison_poster.jpg"></video><p id="status" role="status" aria-live="polite">Загрузка…</p><p id="description"></p><a id="download" download>Скачать MP4</a><details><summary>О проигрывателе</summary><p>Для встроенного браузера первым используется WebM. MP4 сохранён для скачивания и внешних плееров. Во всех примерах тестовый голос Milena.</p><p id="codec"></p></details></main>
<script>
const video=document.getElementById('video'),select=document.getElementById('clip'),status=document.getElementById('status');
const allowed=new Set([...select.options].map(x=>x.value));const initial=new URLSearchParams(location.search).get('clip');if(allowed.has(initial))select.value=initial;
function load(){video.pause();video.replaceChildren();video.poster=select.value==='comparison'?'/comparison_poster.jpg':'';
 for(const [ext,type] of [['webm','video/webm'],['mp4','video/mp4']]){const source=document.createElement('source');source.src=`/${select.value}.${ext}`;source.type=type;video.append(source);}video.load();
 document.getElementById('download').href=`/${select.value}.mp4`;status.textContent='Загрузка…';
 document.getElementById('description').textContent=select.value==='comparison'?'Слева: прямой GPU-рендер. В центре: ближайший готовый кадр. Справа: выбор с учётом соседних состояний.':'Новая русская фраза, собранная из предрасчитанных кадров. Оцените губы со звуком, затем без звука.';
}
select.onchange=load;document.getElementById('play').onclick=()=>video.play().catch(e=>{status.textContent='Не удалось запустить: '+e.message;});document.getElementById('pause').onclick=()=>video.pause();
video.onloadeddata=()=>{status.textContent=`Готово · ${video.videoWidth} × ${video.videoHeight} · ${video.duration.toFixed(1)} с`;};
video.ontimeupdate=()=>{status.textContent=`${video.paused?'Пауза':'Воспроизведение'} · ${video.currentTime.toFixed(1)} / ${video.duration.toFixed(1)} с`;};
video.onerror=()=>{status.textContent='Ошибка декодирования. Скачайте MP4 и откройте во внешнем плеере. Код '+video.error?.code;};
document.getElementById('codec').textContent=`Поддержка WebM: ${video.canPlayType('video/webm; codecs="vp9,opus"')||'нет'}; MP4: ${video.canPlayType('video/mp4; codecs="avc1.64001f,mp4a.40.2"')||'нет'}`;load();
</script></html>
