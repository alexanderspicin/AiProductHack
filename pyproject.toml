[project]
name = "rula-pipecat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[openai,inworld,whisper,websocket,silero,runner]>=1.8.1",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["backend"]
