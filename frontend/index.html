<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>rula-pipecat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
      #scene { width: 100%; height: 100vh; display: block; }
      #ui { position: fixed; top: 12px; left: 12px; z-index: 10; }
      #debug-log { position: fixed; bottom: 0; left: 0; right: 0; max-height: 25vh; overflow-y: auto; font-size: 12px; background: rgba(0,0,0,0.6); padding: 4px 8px; }
      button { margin-right: 8px; }
    </style>
  </head>
  <body>
    <div id="ui">
      <button id="connect-btn">Connect</button>
      <button id="disconnect-btn" disabled>Disconnect</button>
      <span id="connection-status">Disconnected</span>
    </div>
    <canvas id="scene"></canvas>
    <audio id="bot-audio" autoplay></audio>
    <div id="debug-log"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
