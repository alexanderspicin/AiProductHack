server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The avatar mesh is a few megabytes and changes rarely. GLTFLoader reads it
    # as an ArrayBuffer and doesn't care about the type, but serving the correct
    # one beats nginx's application/octet-stream fallback.
    location ~* \.glb$ {
        default_type model/gltf-binary;
        expires 30d;
        add_header Cache-Control "public";
    }
}
